# Synthetic org inventory for the worked example (DESIGN.md §17).
#
# A test harness substitutes this for the GitHub API: `metadata` answers search and
# metadata reads, `files` answers content probes. 20 repositories, of which 12 qualify.
# Every near-miss records WHY it is filtered, so the deterministic validator can be
# checked against it.
org: acme

repositories:
  # ---- qualifying: Scala, public, active, build.sbt on 2.13.12 -> 12 targets ----

  - name: orders-service
    metadata: { language: Scala, private: false, archived: false, fork: false, license: MIT, has_ci: true, pushed_at: 2026-06-14 }
    files: { build.sbt: 'ThisBuild / scalaVersion := "2.13.12"' }

  - name: billing
    metadata: { language: Scala, private: false, archived: false, fork: false, license: MIT, has_ci: true, pushed_at: 2026-05-02 }
    files: { build.sbt: 'ThisBuild / scalaVersion := "2.13.12"' }
    # Drift: a parallel change bumps this to 2.13.14 before the action runs,
    # so triage finds it already satisfied -> `no change needed`.

  - name: legacy-etl
    metadata: { language: Scala, private: false, archived: false, fork: false, license: Apache-2.0, has_ci: true, pushed_at: 2026-04-20 }
    files:
      build.sbt: |
        ThisBuild / scalaVersion := "2.13.12"
        libraryDependencies += "org.scala-lang" % "scala-reflect" % scalaVersion.value
    notes: "Bumping scalaVersion would also force a libraryDependencies pin update, which
            `forbidden_changes` forbids -> `needs operator`."

  - name: reporting
    metadata: { language: Scala, private: false, archived: false, fork: false, license: MIT, has_ci: true, pushed_at: 2026-06-01 }
    files: { build.sbt: 'ThisBuild / scalaVersion := "2.13.12"' }
    notes: "At action time a foreign change proposal already exists on the automation
            branch -> `needs operator`."

  - name: search
    metadata: { language: Scala, private: false, archived: false, fork: false, license: MIT, has_ci: true, pushed_at: 2026-06-30 }
    files: { build.sbt: 'ThisBuild / scalaVersion := "2.13.12"' }
    notes: "The bump applies but `sbt test` fails for unrelated reasons; one escalated
            attempt also fails -> `failed` after max_attempts."

  - name: checkout
    metadata: { language: Scala, private: false, archived: false, fork: false, license: MIT, has_ci: true, pushed_at: 2026-06-11 }
    files: { build.sbt: 'ThisBuild / scalaVersion := "2.13.12"' }

  - name: inventory
    metadata: { language: Scala, private: false, archived: false, fork: false, license: MIT, has_ci: true, pushed_at: 2026-05-28 }
    files: { build.sbt: 'ThisBuild / scalaVersion := "2.13.12"' }

  - name: notifications
    metadata: { language: Scala, private: false, archived: false, fork: false, license: Apache-2.0, has_ci: true, pushed_at: 2026-06-05 }
    files: { build.sbt: 'ThisBuild / scalaVersion := "2.13.12"' }

  - name: analytics
    metadata: { language: Scala, private: false, archived: false, fork: false, license: MIT, has_ci: true, pushed_at: 2026-04-30 }
    files: { build.sbt: 'ThisBuild / scalaVersion := "2.13.12"' }

  - name: gateway
    metadata: { language: Scala, private: false, archived: false, fork: false, license: MIT, has_ci: true, pushed_at: 2026-06-20 }
    files: { build.sbt: 'ThisBuild / scalaVersion := "2.13.12"' }

  - name: identity
    metadata: { language: Scala, private: false, archived: false, fork: false, license: Apache-2.0, has_ci: true, pushed_at: 2026-05-16 }
    files: { build.sbt: 'ThisBuild / scalaVersion := "2.13.12"' }

  - name: scheduler
    metadata: { language: Scala, private: false, archived: false, fork: false, license: MIT, has_ci: true, pushed_at: 2026-06-02 }
    files: { build.sbt: 'ThisBuild / scalaVersion := "2.13.12"' }
    # Drift, same as `billing` -> `no change needed`.

  # ---- non-qualifying: must be filtered, each for the stated reason ----

  - name: docs-site
    metadata: { language: JavaScript, private: false, archived: false, fork: false, pushed_at: 2026-06-10 }
    filtered_by: "metadata: languages"

  - name: old-mono
    metadata: { language: Scala, private: false, archived: true, fork: false, pushed_at: 2026-03-01 }
    filtered_by: "metadata: archived"

  - name: forked-utils
    metadata: { language: Scala, private: false, archived: false, fork: true, pushed_at: 2026-05-05 }
    filtered_by: "metadata: fork"

  - name: internal-secrets
    metadata: { language: Scala, private: true, archived: false, fork: false, pushed_at: 2026-06-01 }
    filtered_by: "scope: visibility (private repo refused in v1)"

  - name: analytics-v2
    metadata: { language: Scala, private: false, archived: false, fork: false, pushed_at: 2026-06-18 }
    files: { build.sbt: 'ThisBuild / scalaVersion := "2.13.14"' }
    filtered_by: "content: scala_version not in [2.13.12]"

  - name: dotfiles
    metadata: { language: Scala, private: false, archived: false, fork: false, pushed_at: 2026-06-01 }
    filtered_by: "scope: exclude_repos"

  - name: not-scala-consumer
    metadata: { language: Go, private: false, archived: false, fork: false, pushed_at: 2026-05-22 }
    filtered_by: "metadata: languages"

  - name: abandoned-api
    metadata: { language: Scala, private: false, archived: false, fork: false, pushed_at: 2024-11-30 }
    filtered_by: "metadata: pushed_after"
